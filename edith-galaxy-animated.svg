<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="orb" cx="31%" cy="25%" r="82%">
      <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".1" stop-color="#e4fbff"/>
      <stop offset=".25" stop-color="#8cecff"/>
      <stop offset=".43" stop-color="#438fdb"/>
      <stop offset=".64" stop-color="#3c4db0"/>
      <stop offset=".82" stop-color="#6b287f"/>
      <stop offset="1" stop-color="#080f2b"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop offset=".25" stop-color="#74dfff" stop-opacity=".62"/>
      <stop offset=".62" stop-color="#7765ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff59d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limbShade" cx="43%" cy="34%" r="68%">
      <stop offset=".35" stop-color="#08152d" stop-opacity="0"/>
      <stop offset=".78" stop-color="#06102a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020713" stop-opacity=".82"/>
    </radialGradient>
    <radialGradient id="rimLight">
      <stop offset=".72" stop-color="#8cecff" stop-opacity="0"/>
      <stop offset=".9" stop-color="#8cecff" stop-opacity=".06"/>
      <stop offset=".97" stop-color="#c5a5ff" stop-opacity=".52"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="galaxyCore">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset=".16" stop-color="#fff1c9" stop-opacity=".98"/>
      <stop offset=".42" stop-color="#ffdca0" stop-opacity=".76"/>
      <stop offset="1" stop-color="#ffbc72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dustArm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8e4c4" stop-opacity=".05"/>
      <stop offset=".48" stop-color="#d5ddf3" stop-opacity=".72"/>
      <stop offset=".72" stop-color="#fff1dc" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8edfff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#51e5ff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#69e8ff"/>
      <stop offset=".43" stop-color="#e7faff"/>
      <stop offset=".62" stop-color="#f9a4ff"/>
      <stop offset=".82" stop-color="#9271ff"/>
      <stop offset="1" stop-color="#51e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nebula" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#64f4ff" stop-opacity=".08"/>
      <stop offset=".4" stop-color="#a9a0ff" stop-opacity=".72"/>
      <stop offset=".72" stop-color="#fa88ec" stop-opacity=".65"/>
      <stop offset="1" stop-color="#64f4ff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="cloudTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="4" seed="19" result="clouds"/>
      <feColorMatrix in="clouds" type="matrix" values=".06 .12 .72 .0 .02 .24 .18 .46 .0 .02 .48 .16 .3 .0 .08 .24 .24 .24 .0 .0" result="nebulaClouds"/>
      <feGaussianBlur in="nebulaClouds" stdDeviation="1.3"/>
    </filter>
    <filter id="atmosphereGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sphereClip">
      <circle cx="400" cy="400" r="132"/>
    </clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="36s" repeatCount="indefinite"/>

    <circle cx="400" cy="400" r="236" fill="url(#aura)" opacity=".8">
      <animate attributeName="opacity" values=".65;.95;.65" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="400" r="156" fill="#6c80ff" opacity=".34" filter="url(#glow)"/>

    <g fill="none">
      <ellipse cx="400" cy="400" rx="294" ry="92" stroke="url(#ring)" stroke-width="2.2" opacity=".9" transform="rotate(-22 400 400)">
        <animateTransform attributeName="transform" type="rotate" from="-22 400 400" to="338 400 400" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="400" cy="400" rx="268" ry="142" stroke="#77dfff" stroke-width="1" stroke-opacity=".48" transform="rotate(29 400 400)">
        <animateTransform attributeName="transform" type="rotate" from="29 400 400" to="-331 400 400" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="400" cy="400" rx="330" ry="56" stroke="url(#ring)" stroke-width="1.2" opacity=".52" transform="rotate(8 400 400)">
        <animateTransform attributeName="transform" type="rotate" from="8 400 400" to="368 400 400" dur="30s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <path d="M92 444 C212 404 289 351 367 346" fill="none" stroke="#71e8ff" stroke-width="15" opacity=".36" filter="url(#softGlow)"/>
    <path d="M92 444 C212 404 289 351 367 346" fill="none" stroke="url(#ring)" stroke-width="2.2"/>
    <path d="M434 457 C532 490 600 533 709 557" fill="none" stroke="#bd8cff" stroke-width="12" opacity=".28" filter="url(#softGlow)"/>
    <path d="M434 457 C532 490 600 533 709 557" fill="none" stroke="url(#ring)" stroke-width="2"/>

    <circle cx="400" cy="400" r="134" fill="#4fcfff" opacity=".28" filter="url(#softGlow)"/>
    <circle cx="400" cy="400" r="132" fill="url(#orb)"/>
    <circle cx="400" cy="400" r="132" fill="url(#rimLight)" opacity=".8"/>
    <circle cx="400" cy="400" r="132" fill="none" stroke="#bcefff" stroke-opacity=".72" stroke-width="1.2" filter="url(#atmosphereGlow)"/>

    <g clip-path="url(#sphereClip)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="16s" repeatCount="indefinite"/>
        <rect x="260" y="260" width="280" height="280" fill="#8ebcff" filter="url(#cloudTexture)" opacity=".48"/>
        <path d="M253 405 C300 314 344 327 391 375 C434 420 476 438 545 351 C507 464 455 496 399 451 C347 409 313 389 253 474Z" fill="url(#nebula)" opacity=".8"/>
        <g transform="rotate(-19 400 400)">
          <path d="M400 400 C420 379 447 383 454 402 C463 427 437 445 412 438 C379 429 366 397 380 373 C398 343 439 338 466 358 C500 383 501 430 475 459 C444 494 390 494 358 464 C322 430 324 374 360 339 C403 298 471 302 511 345"
                fill="none" stroke="#ffe3bd" stroke-width="15" stroke-linecap="round" opacity=".17" filter="url(#softGlow)"/>
          <path d="M400 400 C420 379 447 383 454 402 C463 427 437 445 412 438 C379 429 366 397 380 373 C398 343 439 338 466 358 C500 383 501 430 475 459 C444 494 390 494 358 464 C322 430 324 374 360 339 C403 298 471 302 511 345"
                fill="none" stroke="url(#dustArm)" stroke-width="5.5" stroke-linecap="round" opacity=".68"/>
          <path d="M400 400 C381 419 357 414 349 397 C339 375 360 355 383 359 C414 364 432 394 422 420 C410 451 370 463 341 445 C305 423 296 377 320 344 C349 304 408 291 453 313 C499 336 521 387 505 433"
                fill="none" stroke="#dce8f5" stroke-width="8" stroke-linecap="round" opacity=".2" filter="url(#softGlow)"/>
          <path d="M400 400 C381 419 357 414 349 397 C339 375 360 355 383 359 C414 364 432 394 422 420 C410 451 370 463 341 445 C305 423 296 377 320 344 C349 304 408 291 453 313 C499 336 521 387 505 433"
                fill="none" stroke="#e5edf8" stroke-width="2.6" stroke-linecap="round" opacity=".52"/>
          <path d="M400 400 C432 414 449 442 440 462 C432 479 408 483 395 470 C380 455 387 432 405 424"
                fill="none" stroke="#f8e8d1" stroke-width="2" opacity=".54"/>
          <ellipse cx="400" cy="400" rx="45" ry="33" fill="url(#galaxyCore)" opacity=".9"/>
          <ellipse cx="400" cy="400" rx="19" ry="14" fill="#fff9e9" opacity=".88" filter="url(#softGlow)"/>
          <ellipse cx="400" cy="400" rx="9" ry="7" fill="#fffef8" opacity=".98"/>
          <g fill="#fff8e9">
            <circle cx="466" cy="358" r="1.5" opacity=".85"/>
            <circle cx="358" cy="464" r="1.3" opacity=".8"/>
            <circle cx="320" cy="344" r="1.1" opacity=".72"/>
            <circle cx="505" cy="433" r="1.3" opacity=".76"/>
            <circle cx="438" cy="338" r="1.1" opacity=".68"/>
            <circle cx="347" cy="397" r="1.4" opacity=".8"/>
            <circle cx="475" cy="459" r="1.1" opacity=".75"/>
          </g>
        </g>
        <path d="M246 390 C316 333 356 349 401 392 C448 436 480 425 546 375" fill="none" stroke="#e9faff" stroke-opacity=".58" stroke-width="1.4"/>
        <path d="M254 428 C316 377 353 391 398 427 C445 464 480 454 539 414" fill="none" stroke="#75f0ff" stroke-opacity=".58" stroke-width="1"/>
        <path d="M294 268 C346 337 365 459 318 527" fill="none" stroke="#d4d8ff" stroke-opacity=".38" stroke-width="1"/>
        <path d="M480 272 C435 342 426 455 475 525" fill="none" stroke="#bceeff" stroke-opacity=".34" stroke-width="1"/>
        <ellipse cx="400" cy="400" rx="127" ry="43" fill="none" stroke="#e8fbff" stroke-opacity=".45" stroke-width="1" transform="rotate(-24 400 400)"/>
        <g fill="#fff">
          <circle cx="335" cy="365" r="2" opacity=".9"/>
          <circle cx="455" cy="417" r="1.6" opacity=".85"/>
          <circle cx="382" cy="447" r="1.3" opacity=".8"/>
          <circle cx="432" cy="348" r="1.4" opacity=".88"/>
        </g>
      </g>
      <circle cx="400" cy="400" r="132" fill="url(#limbShade)"/>
    </g>

    <ellipse cx="365" cy="350" rx="54" ry="23" fill="#fff" opacity=".26" filter="url(#softGlow)" transform="rotate(-32 365 350)"/>
    <ellipse cx="365" cy="350" rx="34" ry="12" fill="#fff" opacity=".2" transform="rotate(-32 365 350)"/>
    <circle cx="353" cy="339" r="5" fill="#fff" opacity=".96"/>

    <g fill="#f3fcff">
      <circle cx="128" cy="336" r="3" opacity=".9"/>
      <circle cx="676" cy="318" r="2.5" opacity=".85"/>
      <circle cx="208" cy="547" r="2" opacity=".7"/>
      <circle cx="604" cy="558" r="3" opacity=".86"/>
      <circle cx="563" cy="235" r="1.8" opacity=".72"/>
    </g>
  </g>
</svg>
