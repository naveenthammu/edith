<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDITH Galactic Voyage</title>
<style>
  :root { --cyan: #69e8ff; --violet: #9271ff; --pink: #f9a4ff; --text: #e7faff; --dim: #8fa3c0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #010207; color: var(--text); overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #brand { position: fixed; top: 18px; left: 20px; pointer-events: none; }
  #brand h1 { font-size: 15px; letter-spacing: .42em; font-weight: 600;
    background: linear-gradient(90deg, var(--cyan), var(--pink), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(105,232,255,.6)); }
  #brand p { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: .06em; }
  #caption { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    width: min(680px, calc(100% - 32px)); text-align: center; pointer-events: none;
    font-size: 14px; line-height: 1.5; text-shadow: 0 0 12px rgba(105,232,255,.45); }
  #hint { position: fixed; right: 20px; top: 20px; font-size: 11px; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brand"><h1>EDITH</h1><p>The Sun's voyage through the Milky Way</p></div>
<div id="hint">drag to look around · space to pause</div>
<div id="caption">The Sun circles the galaxy at ~230 km/s, carrying every planet with it — so each one traces a helix.</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, F;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; F = Math.min(W, H) * 1.15;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// Seeded RNG so the galaxy looks the same every load.
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());

// Soft round sprite, pre-rendered once; drawImage is far cheaper than a gradient per object.
function sprite(rgb, falloff = .35) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(falloff, `rgba(${rgb},.35)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
}
const SPR = {
  core: sprite('255,214,150', .2), blue: sprite('90,130,255', .3), violet: sprite('150,95,255', .3),
  pink: sprite('255,70,170', .25), cyan: sprite('90,235,255', .25), star: sprite('235,245,255', .12),
  sun: sprite('255,220,120', .18),
};

// ---- Galaxy in its own rotating frame: bar + bulge + 4 log-spiral arms + diffuse disc ----
const COLORS = ['rgba(255,232,190,.5)', 'rgba(255,200,140,.45)', 'rgba(225,235,255,.85)',
                'rgba(140,190,255,.85)', 'rgba(255,130,210,.8)', 'rgba(120,235,255,.75)'];
const stars = COLORS.map(() => []), haze = [], bright = [];
const ARMS = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2], ARM_W = [1, .45, 1, .45]; // two major, two minor
function armPoint(spread) {
  const k = Math.floor(rnd() * 4);
  if (rnd() > ARM_W[k]) return null;
  const r = 2 + 9 * Math.pow(rnd(), .9);
  const a = ARMS[k] + Math.log(r / 2) * 2.6 + gauss() * spread * (1 + r / 12);
  return [r * Math.cos(a), r * Math.sin(a), r];
}
for (let i = 0; i < 42000; i++) {
  let x, z, y, b, roll = rnd();
  if (roll < .14) {                                  // bulge + central bar
    const r = Math.abs(gauss()) * 1.1, a = rnd() * Math.PI * 2;
    x = r * Math.cos(a) * 1.9; z = r * Math.sin(a) * .75; y = gauss() * .4 * Math.exp(-r / 1.5);
    b = rnd() < .55 ? 0 : 1;
  } else if (roll < .72) {                           // arms
    const p = armPoint(.2); if (!p) { i--; continue; }
    [x, z] = p; y = gauss() * .1;
    const k = rnd(); b = k < .1 ? 4 : k < .45 ? 3 : k < .7 ? 5 : 2;
  } else {                                           // diffuse exponential disc
    const r = Math.min(-2.8 * Math.log(rnd() || 1e-9) + .8, 12), a = rnd() * Math.PI * 2;
    x = r * Math.cos(a); z = r * Math.sin(a); y = gauss() * .14;
    b = r < 3.5 ? 1 : rnd() < .6 ? 2 : 3;
  }
  stars[b].push(x, y, z, .5 + rnd() * 1.3);
}
for (let i = 0; i < 1600; i++) {                     // glowing gas along the arms
  const p = armPoint(.16); if (!p) { i--; continue; }
  const k = rnd();
  haze.push([p[0], gauss() * .08, p[1], .7 + rnd() * 1.4,
    k < .14 ? SPR.pink : k < .55 ? SPR.blue : k < .8 ? SPR.violet : SPR.cyan, k < .14 ? .13 : .05]);
}
for (let i = 0; i < 520; i++) {                      // bright young stars that glow and twinkle
  const p = armPoint(.22); if (!p) { i--; continue; }
  bright.push([p[0], gauss() * .08, p[1], 3 + rnd() * 8, rnd() * 6.28]);
}
const sky = Array.from({ length: 1800 }, () => {    // distant background stars on a sphere
  const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return [s * Math.cos(a) * 120, u * 120, s * Math.sin(a) * 120, rnd(), rnd() * 6.28];
});

// ---- Sun and planets (sizes/periods exaggerated so the helix reads from a galaxy-wide view) ----
const R_SUN = 6.6, OMEGA = 2 * Math.PI / 80, PATTERN = OMEGA * .55, TILT = Math.PI / 3; // ecliptic ~60° to galactic plane
const PLANETS = [
  ['#c9c2b8', .2, .5], ['#ffd79a', .3, .8], ['#4fb4ff', .4, 1.2], ['#ff6a3d', .5, 1.7],
  ['#ffc27a', .72, 2.8], ['#ffe2a0', .88, 3.8], ['#7ff3ff', 1.02, 5], ['#5a6cff', 1.15, 6.4],
].map(([color, r, period], i) => ({ color, r, period, phase: i * 1.7 }));
const TRAIL = 360;
const trails = [...PLANETS.map(p => p.color), '#ffd36b'].map(color => ({ color, buf: new Float32Array(TRAIL * 3), n: 0, head: 0 }));

function bodies(t) {
  const sa = OMEGA * t, c = Math.cos(sa), s = Math.sin(sa);
  const S = [R_SUN * c, 0, R_SUN * s];
  // radial a=(c,0,s); ecliptic normal N tilted from galactic up toward the direction of motion
  const nx = -s * Math.sin(TILT), ny = Math.cos(TILT), nz = c * Math.sin(TILT);
  const b = [ny * s, nz * c - nx * s, -ny * c];          // N × a
  const pts = PLANETS.map(p => {
    const th = p.phase + 2 * Math.PI * t / p.period, ct = Math.cos(th) * p.r, st = Math.sin(th) * p.r;
    return [S[0] + ct * c + st * b[0], S[1] + st * b[1], S[2] + ct * s + st * b[2]];
  });
  pts.push(S);
  return { S, pts };
}

// ---- Camera: fixed wide view of the whole galaxy, slow drift ----
// ?t=20 in the URL starts the clock later (trails already grown)
let t = +new URLSearchParams(location.search).get('t') || 0, paused = false, last = performance.now();
let dragYaw = 0, dragPitch = 0;
const cam = { p: [0, 0, 0], r: [0, 0, 0], u: [0, 0, 0], f: [0, 0, 0] };
function setCamera(yaw, pitch, dist) {
  const cp = Math.cos(pitch);
  const p = [dist * cp * Math.cos(yaw), dist * Math.sin(pitch), dist * cp * Math.sin(yaw)];
  const f = p.map(v => -v / dist);
  let r = [-f[2], 0, f[0]]; const rl = Math.hypot(...r) || 1; r = r.map(v => v / rl);  // f × up
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  Object.assign(cam, { p, r, u, f });
}
const P = [0, 0, 0];               // reused projection result: screen x, y, depth
function project(x, y, z) {
  const vx = x - cam.p[0], vy = y - cam.p[1], vz = z - cam.p[2];
  const d = vx * cam.f[0] + vy * cam.f[1] + vz * cam.f[2];
  if (d < .3) return false;
  P[0] = W / 2 + (vx * cam.r[0] + vy * cam.r[1] + vz * cam.r[2]) * F / d;
  P[1] = H / 2 - (vx * cam.u[0] + vy * cam.u[1] + vz * cam.u[2]) * F / d;
  P[2] = d;
  return true;
}
function blit(img, size, alpha) {  // draws a sprite centred on the last projected point
  g.globalAlpha = alpha; g.drawImage(img, P[0] - size / 2, P[1] - size / 2, size, size);
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  if (!paused) t += dt;
  const { S, pts } = bodies(t);
  const pitch = Math.max(-1.45, Math.min(1.45, .72 + dragPitch));
  setCamera(-1.2 + t * .012 + dragYaw, pitch, 27);
  const ga = PATTERN * t, gc = Math.cos(ga), gs = Math.sin(ga);   // arms turn slower than the Sun

  if (!paused) trails.forEach((tr, i) => {
    tr.buf.set(pts[i], tr.head * 3); tr.head = (tr.head + 1) % TRAIL; tr.n = Math.min(tr.n + 1, TRAIL);
  });

  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = '#010207'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';

  // background sky
  g.fillStyle = '#dfe9ff';
  for (const [x, y, z, m, ph] of sky) {
    if (!project(cam.p[0] + x, cam.p[1] + y, cam.p[2] + z)) continue;
    g.globalAlpha = .25 + .5 * m * (.7 + .3 * Math.sin(t * 1.5 + ph));
    const s = .6 + m; g.fillRect(P[0], P[1], s, s);
  }

  // gas clouds
  for (const [x, y, z, w, img, a] of haze) {
    if (!project(x * gc - z * gs, y, x * gs + z * gc)) continue;
    blit(img, w * F / P[2], a);
  }
  // core + bar glow
  if (project(0, 0, 0)) { blit(SPR.core, 6 * F / P[2], .35); blit(SPR.core, 2 * F / P[2], .6); }
  if (project(1.5 * gc, 0, 1.5 * gs)) blit(SPR.core, 2 * F / P[2], .2);
  if (project(-1.5 * gc, 0, -1.5 * gs)) blit(SPR.core, 2 * F / P[2], .2);

  // stars
  g.globalAlpha = 1;
  stars.forEach((arr, bi) => {
    g.fillStyle = COLORS[bi];
    for (let i = 0; i < arr.length; i += 4) {
      const x = arr[i], z = arr[i + 2];
      if (!project(x * gc - z * gs, arr[i + 1], x * gs + z * gc)) continue;
      const s = Math.min(arr[i + 3] * F / P[2] * .024, 2.2);
      g.fillRect(P[0] - s / 2, P[1] - s / 2, s, s);
    }
  });
  for (const [x, y, z, s, ph] of bright) {
    if (!project(x * gc - z * gs, y, x * gs + z * gc)) continue;
    blit(SPR.star, s * 21 / P[2], .55 + .45 * Math.sin(t * 2.2 + ph));
  }

  // Sun's galactic orbit
  g.globalAlpha = 1; g.strokeStyle = 'rgba(105,232,255,.28)'; g.lineWidth = 1; g.setLineDash([4, 7]);
  g.beginPath();
  for (let k = 0; k <= 160; k++) {
    const a = k / 160 * Math.PI * 2;
    if (project(R_SUN * Math.cos(a), 0, R_SUN * Math.sin(a))) k ? g.lineTo(P[0], P[1]) : g.moveTo(P[0], P[1]);
  }
  g.stroke(); g.setLineDash([]);

  // helical trails: wide faint pass for glow, thin bright pass on top; 12 chunks fade toward the tail
  g.lineCap = g.lineJoin = 'round';
  const CH = 12;
  trails.forEach((tr, i) => {
    if (tr.n < 2) return;
    const isSun = i === PLANETS.length;
    const xy = [];
    for (let k = 0; k < tr.n; k++) {
      const j = ((tr.head - tr.n + k + TRAIL) % TRAIL) * 3;
      xy.push(project(tr.buf[j], tr.buf[j + 1], tr.buf[j + 2]) ? [P[0], P[1]] : null);
    }
    g.strokeStyle = tr.color;
    for (const [width, alpha] of [[isSun ? 9 : 7, .16], [isSun ? 2.4 : 1.8, 1]]) {
      g.lineWidth = width;
      for (let c = 0; c < CH; c++) {
        const from = Math.floor(c * xy.length / CH), to = Math.min(xy.length - 1, Math.floor((c + 1) * xy.length / CH));
        g.globalAlpha = alpha * ((c + 1) / CH) ** 1.6;
        g.beginPath(); let open = false;
        for (let k = from; k <= to; k++) {
          const q = xy[k];
          if (!q) { open = false; continue; }
          open ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); open = true;
        }
        g.stroke();
      }
    }
  });

  // planets
  pts.forEach((p, i) => {
    if (i === PLANETS.length || !project(...p)) return;
    const rad = Math.max(2, Math.min(5, .09 * F / P[2]));
    g.globalAlpha = .9; g.shadowColor = PLANETS[i].color; g.shadowBlur = 14;
    g.fillStyle = PLANETS[i].color; g.beginPath(); g.arc(P[0], P[1], rad, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
  });

  // the Sun: wide corona, pulsing halo, white-hot core
  if (project(...S)) {
    const k = F / P[2], pulse = 1 + .06 * Math.sin(t * 3);
    blit(SPR.sun, 4.2 * k * pulse, .55);
    blit(SPR.sun, 1.6 * k, .95);
    blit(SPR.star, .5 * k, 1);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = .9;
    g.fillStyle = '#e7faff'; g.font = '12px "Segoe UI", sans-serif';
    g.fillText('Sun', P[0] + .5 * k + 6, P[1] - .5 * k - 4);
  }

  requestAnimationFrame(frame);
}

// look-around: drag rotates the camera on top of the slow drift
let dragging = null;
cv.addEventListener('pointerdown', e => { dragging = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragYaw += (e.clientX - dragging[0]) * .005; dragPitch += (e.clientY - dragging[1]) * .004;
  dragging = [e.clientX, e.clientY];
});
cv.addEventListener('pointerup', () => dragging = null);
addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });
requestAnimationFrame(frame);
</script>
</body>
</html>
