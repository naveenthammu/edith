<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EDITH</title>
<style>
  /* --card must match CARD in overlay.py (the window's own background) */
  :root { --card: rgb(4,4,6); --cyan: #69e8ff; --text: #e7faff;
    --glass: rgba(22,22,28,.9); --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--card); overflow: hidden; color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; user-select: none; }
  #shell { width: 100%; opacity: 0; transform: scale(.9); transform-origin: top right;
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,.9,.3,1.2); }
  body.awake #shell { opacity: 1; transform: none; }
  #stage { position: relative; height: 260px; display: flex; justify-content: center; }
  /* the galaxy is the drag handle: pywebview moves the frameless window on .pywebview-drag-region */
  canvas { display: block; width: 260px; height: 260px; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #bar { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; }
  #bar button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--glass); color: var(--text); font-size: 10px; line-height: 1; cursor: pointer;
    transition: background .2s, transform .2s; }
  #bar button:hover { background: rgba(60,60,72,.95); }
  #bar button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #histBtn[aria-expanded="true"] { transform: rotate(180deg); }
  #micBtn { display: grid; place-items: center; padding: 0; }
  #micBtn .slash { display: none; }
  #micBtn[aria-pressed="true"] { background: rgba(220,60,70,.9); border-color: rgba(255,120,120,.8); }
  #micBtn[aria-pressed="true"] .slash { display: inline; }
  #panel { display: none; margin: 0 8px 8px; max-height: 200px; overflow-y: auto; padding: 8px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; user-select: text; }
  /* no standard scrollbar-color here: Chromium then ignores these ::-webkit rules and shows arrows */
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 3px; }
  #panel::-webkit-scrollbar-thumb:hover { background: rgba(105,232,255,.5); }
  #panel::-webkit-scrollbar-button { display: none; }
  #panel.open { display: block; }
  #history { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  #history li { max-width: 85%; padding: 5px 9px; border-radius: 11px; font-size: 12px; line-height: 1.4; word-wrap: break-word; }
  #history li.you { align-self: flex-end; background: rgba(105,232,255,.13); border: 1px solid rgba(105,232,255,.25); }
  #history li.edith { align-self: flex-start; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  #empty { color: #8fa3c0; text-align: center; padding: 6px; }
  #history:not(:empty) + #empty { display: none; }
</style>
</head>
<body>
<div id="shell">
  <div id="stage">
    <canvas id="c" class="pywebview-drag-region" aria-hidden="true" title="Drag to move"></canvas>
    <div id="bar">
      <button id="micBtn" aria-label="Mute microphone" aria-pressed="false" title="Mute microphone">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
      <button id="histBtn" aria-label="Show history" aria-expanded="false" aria-controls="panel">▾</button>
      <button id="minBtn" aria-label="Minimize">–</button>
      <button id="closeBtn" aria-label="Close">✕</button>
    </div>
  </div>
  <div id="panel" role="log" aria-live="polite"><ul id="history"></ul><p id="empty">Nothing asked yet.</p></div>
</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
// Don't shrink F/W much: the 22k additive stars then overlap into a washed-out white blob.
const W = 260, H = 260, F = 320;         // focal length: whole galaxy fits even at the lowest camera tilt
const PX = F / 862;                      // scale for sizes tuned on the full-screen version
(function () {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
})();

// Seeded RNG so the galaxy looks the same every load.
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());

// Soft round sprite, pre-rendered once; drawImage is far cheaper than a gradient per object.
function sprite(rgb, falloff = .35) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(falloff, `rgba(${rgb},.35)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
}
const SPR = {
  core: sprite('255,214,150', .2), blue: sprite('90,130,255', .3), violet: sprite('150,95,255', .3),
  pink: sprite('255,70,170', .25), cyan: sprite('90,235,255', .25), star: sprite('235,245,255', .12),
  sun: sprite('255,220,120', .18),
};

// ---- Galaxy: bar + bulge + 4 trailing log-spiral arms + diffuse disc ----
const COLORS = ['rgba(255,232,190,.6)', 'rgba(255,200,140,.55)', 'rgba(225,235,255,.9)',
                'rgba(140,190,255,.9)', 'rgba(255,130,210,.85)', 'rgba(120,235,255,.8)'];
const stars = COLORS.map(() => []), haze = [], bright = [];
const ARMS = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2], ARM_W = [1, .45, 1, .45]; // two major, two minor
const SPIRAL = 2.6;  // arms trail the rotation: angle falls as radius grows
function armPoint(spread) {
  const k = Math.floor(rnd() * 4);
  if (rnd() > ARM_W[k]) return null;
  const r = 2 + 9 * Math.pow(rnd(), .9);
  const a = ARMS[k] - Math.log(r / 2) * SPIRAL + gauss() * spread * (1 + r / 12);
  return [r * Math.cos(a), r * Math.sin(a), r];
}
// Outer disc warps up on one side and down on the other, like the real Milky Way.
const warpRA = (r, a) => r > 7 ? .5 * ((r - 7) / 5) ** 2 * Math.sin(a) : 0;
const warp = (x, z) => warpRA(Math.hypot(x, z), Math.atan2(z, x));
// Disc thickens (flares) with radius, which is what makes the tilted view read as 3D.
const thick = r => .1 + r * .014;
// Each star moves on its own: [type, radius, angle, height, size]. type 0 bulge/bar, 1 arm, 2 disc.
// Arm stars hold an arm-relative angle; bulge and disc stars hold their current angle.
for (let i = 0; i < 22000; i++) {
  let s, b, roll = rnd();
  if (roll < .14) {                                  // bulge + central bar
    const r = Math.abs(gauss()) * 1.1;
    s = [0, r, rnd() * Math.PI * 2, gauss() * .8 * Math.exp(-r / 1.8)];  // puffy spheroid
    b = rnd() < .55 ? 0 : 1;
  } else if (roll < .72) {                           // arms, seeded all the way into the core
    const k = Math.floor(rnd() * 4); if (rnd() > ARM_W[k]) { i--; continue; }
    const r = .3 + 11 * Math.pow(rnd(), .85);
    s = [1, r, ARMS[k] + gauss() * .2 * (1 + r / 12), gauss()];
    const c = rnd(); b = c < .1 ? 4 : c < .45 ? 3 : c < .7 ? 5 : 2;
  } else {                                           // diffuse exponential disc
    const r = Math.min(-2.8 * Math.log(rnd() || 1e-9) + .8, 12);
    s = [2, r, rnd() * Math.PI * 2, gauss() * 1.6];
    b = r < 3.5 ? 1 : rnd() < .6 ? 2 : 3;
  }
  stars[b].push(...s, .5 + rnd() * 1.3);
}
stars.forEach((arr, i) => stars[i] = Float32Array.from(arr));
for (let i = 0; i < 900; i++) {                      // glowing gas along the arms
  const p = armPoint(.16); if (!p) { i--; continue; }
  const k = rnd();
  haze.push([p[0], gauss() * .08 + warp(p[0], p[1]), p[1], .7 + rnd() * 1.4,
    k < .14 ? SPR.pink : k < .55 ? SPR.blue : k < .8 ? SPR.violet : SPR.cyan, k < .14 ? .16 : .07]);
}
for (let i = 0; i < 260; i++) {                      // bright young stars that glow and twinkle
  const p = armPoint(.22); if (!p) { i--; continue; }
  bright.push([p[0], gauss() * .08 + warp(p[0], p[1]), p[1], 3 + rnd() * 8, rnd() * 6.28]);
}

// ---- Sun and planets (sizes/periods exaggerated so the helix reads from a galaxy-wide view) ----
const R_SUN = 6.6, OMEGA = 2 * Math.PI / 50, PATTERN = OMEGA * .55, TILT = Math.PI / 3; // ecliptic ~60° to galactic plane
const INFLOW = .1;   // how fast arm stars slide toward the nucleus (units/s at the rim)
const PLANETS = [
  ['#c9c2b8', .2, .5], ['#ffd79a', .3, .8], ['#4fb4ff', .4, 1.2], ['#ff6a3d', .5, 1.7],
  ['#ffc27a', .72, 2.8], ['#ffe2a0', .88, 3.8], ['#7ff3ff', 1.02, 5], ['#5a6cff', 1.15, 6.4],
].map(([color, r, period], i) => ({ color, r, period, phase: i * 1.7 }));
const TRAIL = 360;
const trails = [...PLANETS.map(p => p.color), '#ffd36b'].map(color => ({ color, buf: new Float32Array(TRAIL * 3), n: 0, head: 0 }));

function bodies(t) {
  const sa = OMEGA * t, c = Math.cos(sa), s = Math.sin(sa);
  const S = [R_SUN * c, 0, R_SUN * s];
  // radial a=(c,0,s); ecliptic normal N tilted from galactic up toward the direction of motion
  const nx = -s * Math.sin(TILT), ny = Math.cos(TILT), nz = c * Math.sin(TILT);
  const b = [ny * s, nz * c - nx * s, -ny * c];          // N × a
  const pts = PLANETS.map(p => {
    const th = p.phase + 2 * Math.PI * t / p.period, ct = Math.cos(th) * p.r, st = Math.sin(th) * p.r;
    return [S[0] + ct * c + st * b[0], S[1] + st * b[1], S[2] + ct * s + st * b[2]];
  });
  pts.push(S);
  return { S, pts };
}

// ---- Camera: wide view of the whole galaxy, slow drift and gentle bob ----
const params = new URLSearchParams(location.search);
let t = +params.get('t') || 0, last = performance.now();   // ?t=12 starts later, awake (for previews)
const cam = { p: [0, 0, 0], r: [0, 0, 0], u: [0, 0, 0], f: [0, 0, 0] };
function setCamera(yaw, pitch, dist) {
  const cp = Math.cos(pitch);
  const p = [dist * cp * Math.cos(yaw), dist * Math.sin(pitch), dist * cp * Math.sin(yaw)];
  const f = p.map(v => -v / dist);
  let r = [-f[2], 0, f[0]]; const rl = Math.hypot(...r) || 1; r = r.map(v => v / rl);  // f × up
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  Object.assign(cam, { p, r, u, f });
}
const P = [0, 0, 0];               // reused projection result: screen x, y, depth
function project(x, y, z) {
  const vx = x - cam.p[0], vy = y - cam.p[1], vz = z - cam.p[2];
  const d = vx * cam.f[0] + vy * cam.f[1] + vz * cam.f[2];
  if (d < .3) return false;
  P[0] = W / 2 + (vx * cam.r[0] + vy * cam.r[1] + vz * cam.r[2]) * F / d;
  P[1] = H / 2 - (vx * cam.u[0] + vy * cam.u[1] + vz * cam.u[2]) * F / d;
  P[2] = d;
  return true;
}
function blit(img, size, alpha) {  // draws a sprite centred on the last projected point
  g.globalAlpha = alpha; g.drawImage(img, P[0] - size / 2, P[1] - size / 2, size, size);
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  t += dt;
  const { S, pts } = bodies(t);
  setCamera(-1.2 + t * .025, .6 + .16 * Math.sin(t * .12), 33);
  const ga = PATTERN * t, gc = Math.cos(ga), gs = Math.sin(ga);   // arms turn slower than the Sun

  trails.forEach((tr, i) => {
    tr.buf.set(pts[i], tr.head * 3); tr.head = (tr.head + 1) % TRAIL; tr.n = Math.min(tr.n + 1, TRAIL);
  });

  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';

  for (const [x, y, z, w, img, a] of haze) {          // gas clouds
    if (!project(x * gc - z * gs, y, x * gs + z * gc)) continue;
    blit(img, w * F / P[2], a);
  }
  if (project(0, 0, 0)) { blit(SPR.core, 6 * F / P[2], .4); blit(SPR.core, 2 * F / P[2], .7); }
  if (project(1.5 * gc, 0, 1.5 * gs)) blit(SPR.core, 2 * F / P[2], .25);
  if (project(-1.5 * gc, 0, -1.5 * gs)) blit(SPR.core, 2 * F / P[2], .25);

  stars.forEach((arr, bi) => {
    g.fillStyle = COLORS[bi];
    for (let i = 0; i < arr.length; i += 5) {
      let r = arr[i + 1], x, y, z;
      if (arr[i] === 0) {                    // bulge/bar: stars circle inside the rotating bar
        const a = arr[i + 2] += 2.2 * OMEGA * dt;
        const bx = r * Math.cos(a) * 1.9, bz = r * Math.sin(a) * .75;
        x = bx * gc - bz * gs; z = bx * gs + bz * gc; y = arr[i + 3];
      } else {
        // drift inward, faster near the centre; swallowed stars reappear at the rim
        r -= INFLOW * (1 + 2.5 / (r + .4)) * dt * (arr[i] === 1 ? 1 : .35);
        if (r < .12) { r = 10.5 + rnd() * 1.5; if (arr[i] === 2) arr[i + 2] = rnd() * 6.283; }
        arr[i + 1] = r;
        // arm stars follow the arm's spiral, so falling inward swirls them round into the core;
        // disc stars orbit at their own speed (inner ones faster)
        const a = arr[i] === 1 ? ga + arr[i + 2] - Math.log(r / 2) * SPIRAL
                               : (arr[i + 2] += OMEGA * (R_SUN + .6) / (r + .6) * dt);
        x = r * Math.cos(a); z = r * Math.sin(a); y = arr[i + 3] * thick(r) + warpRA(r, a);
      }
      if (!project(x, y, z)) continue;
      const s = Math.max(.7, Math.min(arr[i + 4] * F / P[2] * .024, 2));
      g.globalAlpha = Math.min(1, 40 / P[2] - .55);  // far side dimmer: depth cue
      g.fillRect(P[0] - s / 2, P[1] - s / 2, s, s);
    }
  });
  for (const [x, y, z, s, ph] of bright) {
    if (!project(x * gc - z * gs, y, x * gs + z * gc)) continue;
    blit(SPR.star, s * 21 * PX / P[2] * 1.6, .55 + .45 * Math.sin(t * 2.2 + ph));
  }

  // helical trails: wide faint pass for glow, thin bright pass on top; 12 chunks fade toward the tail
  g.lineCap = g.lineJoin = 'round';
  const CH = 12;
  trails.forEach((tr, i) => {
    if (tr.n < 2) return;
    const isSun = i === PLANETS.length;
    const xy = [];
    for (let k = 0; k < tr.n; k++) {
      const j = ((tr.head - tr.n + k + TRAIL) % TRAIL) * 3;
      xy.push(project(tr.buf[j], tr.buf[j + 1], tr.buf[j + 2]) ? [P[0], P[1]] : null);
    }
    g.strokeStyle = tr.color;
    for (const [width, alpha] of [[isSun ? 5 : 4, .18], [isSun ? 1.4 : 1, 1]]) {
      g.lineWidth = width;
      for (let c = 0; c < CH; c++) {
        const from = Math.floor(c * xy.length / CH), to = Math.min(xy.length - 1, Math.floor((c + 1) * xy.length / CH));
        g.globalAlpha = alpha * ((c + 1) / CH) ** 1.6;
        g.beginPath(); let open = false;
        for (let k = from; k <= to; k++) {
          const q = xy[k];
          if (!q) { open = false; continue; }
          open ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); open = true;
        }
        g.stroke();
      }
    }
  });

  pts.forEach((p, i) => {                                // planets
    if (i === PLANETS.length || !project(...p)) return;
    g.globalAlpha = .9; g.shadowColor = PLANETS[i].color; g.shadowBlur = 8;
    g.fillStyle = PLANETS[i].color; g.beginPath(); g.arc(P[0], P[1], 1.6, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
  });

  if (project(...S)) {                                   // the Sun: corona, pulsing halo, white-hot core
    const k = F / P[2], pulse = 1 + .06 * Math.sin(t * 3);
    blit(SPR.sun, 4.2 * k * pulse, .55);
    blit(SPR.sun, 1.6 * k, .95);
    blit(SPR.star, .5 * k, 1);
  }
}

// ---- Overlay controls, driven from Python via evaluate_js ----
let running = false;
function loop(now) { if (!running) return; frame(now); requestAnimationFrame(loop); }
const histBtn = document.getElementById('histBtn'), panel = document.getElementById('panel'),
      list = document.getElementById('history');
window.orb = {
  wake() {
    document.body.classList.add('awake');
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
  },
  sleep() {   // stop drawing once the fade-out finishes so a hidden orb costs no CPU
    document.body.classList.remove('awake');
    setTimeout(() => { if (!document.body.classList.contains('awake')) running = false; }, 400);
  },
  add(who, text) {
    const li = document.createElement('li');
    li.className = who === 'you' ? 'you' : 'edith';
    li.textContent = text;                 // textContent: transcripts are never parsed as HTML
    list.appendChild(li);
    panel.scrollTop = panel.scrollHeight;
    fit();
  },
};
// the window is an opaque-ish card, so it must shrink/grow with the history panel
function fit() { if (window.pywebview) pywebview.api.fit(document.getElementById('shell').offsetHeight); }
histBtn.addEventListener('click', () => {
  const open = panel.classList.toggle('open');
  histBtn.setAttribute('aria-expanded', open);
  histBtn.setAttribute('aria-label', open ? 'Hide history' : 'Show history');
  panel.scrollTop = panel.scrollHeight;
  fit();
});
const micBtn = document.getElementById('micBtn');
micBtn.addEventListener('click', async () => {
  if (!window.pywebview) return;
  const muted = await pywebview.api.toggle_mic();
  micBtn.setAttribute('aria-pressed', muted);
  const label = muted ? 'Unmute microphone' : 'Mute microphone';
  micBtn.setAttribute('aria-label', label);
  micBtn.title = label;
});
document.getElementById('minBtn').addEventListener('click', () => {
  if (window.pywebview) pywebview.api.minimize();
});
document.getElementById('closeBtn').addEventListener('click', () => {
  if (window.pywebview) pywebview.api.close(); else orb.sleep();
});
if (params.has('t')) orb.wake();
</script>
</body>
</html>
